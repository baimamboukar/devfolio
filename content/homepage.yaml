hero:
  greeting: "Hi, I'm Baimam Boukar"
  emoji: '👋'
  introduction: "I am a researcher working on mechanistic interpretability and AI alignment. I study why current interpretability methods fail to generalize, and build more reliable tools to understand and control large language models. I recently completed my master's in Applied Machine Learning at Carnegie Mellon University, and I am currently a Research Assistant at Jinesis AI Lab, University of Toronto, working on the generalizability of mechanistic interpretability techniques."
