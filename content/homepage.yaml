hero:
  name: Baimam Boukar
  discipline: Understanding and Steering Language Models
  introduction: >-
    I am interested in what we can learn from language models internals, and what that understanding lets us do.
    My current focus is the generalizability of interpretability methods across models, tasks and distribution shifts,
    and their implications for reliable interventions.
  current_work: >-
    At Jinesis AI Lab, I work on reproducing activation-probing studies and evaluating their generalization across
    models, independently refitting probes for each target model.
  background: >-
    My background spans machine learning at CMU-Africa, research at IBM, and software engineering.
