overview: 'I am an AI safety researcher and a recent master graduate from Carnegie Mellon University. I am broadly interested in making AI go well. My work focuses on mechanistic interpretability and the science of evals for emergent capabilities in LLMs — currently exploring why interpretability techniques often fail to generalize. I am also interested in AI sentience, particularly the question of moral and mind attribution in LLMs. My background in software engineering grounds my research in rigorous, reproducible experimentation.'

