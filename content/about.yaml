title: About
overview: >-
  I work on mechanistic interpretability and AI safety, with a focus on the reliability of white-box monitoring and
  activation-level interventions. I study how probing results change across models, layers, datasets, and
  data-generation settings, and when predictive representations provide useful targets for steering. My research
  combines reproduction, controlled experiments, and careful evaluation of generalization and failure modes.
